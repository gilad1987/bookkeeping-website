    <style>
      /* Critical CSS for fast first paint */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-family: "Assistant", system-ui, -apple-system, sans-serif;

      body {
        background: #fcfcfb;
      }

      #root {

      /* Loading animation */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fcfcfb;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #f5f5f4;
        border-top: 3px solid #8b5cf6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
